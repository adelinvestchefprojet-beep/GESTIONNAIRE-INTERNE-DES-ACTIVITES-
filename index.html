<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B3F">
<title>ADEL INVEST × SIAT SÉNÉGAL — Plateforme de gestion</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--v:#0E6B3F;--v2:#17A05D;--vf:#073B24;--vp:#E7F6ED;--or:#D4A12E;--gris:#5F6F66;--bd:#DDE8E1;--ink:#12241B;--bg:#F4F8F5;--card:#fff;--sidebg:rgba(255,255,255,.95)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1712;--card:#14211a;--ink:#e6f1ea;--gris:#9db5a7;--bd:#254033;--vp:#1a3326;--sidebg:#101c15}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#login{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,var(--v2),transparent 45%),linear-gradient(160deg,var(--vf),var(--v))}
.lbox{background:var(--card);border-radius:26px;padding:34px 28px;width:100%;max-width:410px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.lbox h1{font-size:21px;font-weight:800;color:var(--v);text-align:center}.lbox p.s{font-size:12px;color:var(--gris);text-align:center;margin-bottom:22px}
.logo{width:62px;height:62px;margin:0 auto 12px;background:var(--vp);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:31px}
.f{margin-bottom:14px}.f label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:5px}
.f input{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;font:500 16px inherit;font-family:inherit;background:var(--bg);color:var(--ink);outline:none}
.f input:focus{border-color:var(--v2);box-shadow:0 0 0 3px rgba(23,160,93,.18)}
.err{display:none;background:#FFF1EF;color:#D2453A;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;font:800 15px inherit;font-family:inherit;cursor:pointer}
#app{display:none;height:100%;flex-direction:column}
.top{height:60px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(120deg,var(--vf),var(--v) 60%,var(--v2));color:#fff;box-shadow:0 4px 20px rgba(7,59,36,.25);z-index:20}
.burger{display:none;background:rgba(255,255,255,.15);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand i{width:38px;height:38px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;flex-shrink:0}
.brand b{font-size:16px;font-weight:800;display:block;line-height:1.15}.brand small{font-size:10px;opacity:.75;letter-spacing:.8px;text-transform:uppercase}
.sp{flex:1}.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:5px 12px 5px 6px;border-radius:999px}
.av{width:30px;height:30px;border-radius:50%;background:var(--or);color:#3a2a00;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.chip div b{font-size:12px;display:block;line-height:1.1}.chip div small{font-size:10px;opacity:.8}
.tb{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;height:38px;padding:0 12px;cursor:pointer;font:700 12px inherit;font-family:inherit}.tb:hover{background:rgba(255,255,255,.28)}
.body{flex:1;display:flex;min-height:0;position:relative}
.side{width:250px;flex-shrink:0;overflow-y:auto;background:var(--sidebg);border-right:1px solid var(--bd);padding:10px 12px 30px}
.ng{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gris);padding:16px 10px 6px}
.ng.mod{color:var(--v);display:flex;align-items:center;gap:6px;border-top:1px solid var(--bd);margin-top:10px;padding-top:14px}
.ng.mod:first-child{border-top:0;margin-top:0}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--ink);cursor:pointer;font-weight:600;margin-bottom:2px;transition:.15s}
.ni .i{width:24px;text-align:center;font-size:16px}.ni:hover{background:var(--vp);color:var(--v)}
.ni.on{background:linear-gradient(120deg,var(--v),var(--v2));color:#fff;box-shadow:0 6px 16px rgba(15,138,75,.28)}
.main{flex:1;min-width:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}iframe.show{display:block}
.scrim{display:none;position:fixed;inset:60px 0 0 0;background:rgba(5,54,31,.5);z-index:25}
@media(max-width:860px){.burger{display:block}.side{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 30px rgba(0,0,0,.2)}.side.open{transform:none}.scrim.show{display:block}.chip div{display:none}.chip{padding:4px}.brand small{display:none}}
</style></head><body>

function side(o){$('#side').classList.toggle('open',o);$('#scrim').classList.toggle('show',o)}
$('#bg').onclick=()=>side(!$('#side').classList.contains('open'));$('#scrim').onclick=()=>side(false);
const ROLE={admin:'🔑 Administrateur',editeur:'✏️ Éditeur',visiteur:'👁 Lecture seule'};
function start(){$('#av').textContent=U.initiales;$('#un').textContent=U.nom;$('#ur').textContent=ROLE[U.role];
 $('#setb').style.display=U.role==='admin'?'':'none';
 let a=dec(SRC_A);if(U.role==='visiteur')a=a.replace('</head>','<style>[onclick*="openForm"],[onclick*="delRow"],[onclick*="advance"],[onclick*="editLinked"],[onclick*="wipe"],[onclick*="demo"],[onclick*="importBackup"]{display:none!important}</style></head>');
 const fa=$('#fa'),fs=$('#fs');fa.onload=()=>{buildSide();const w=fa.contentWindow;w.addEventListener('hashchange',()=>{if(CUR&&CUR[0]==='a')mark('a:'+w.CUR)});openA('dashboard')};
 fs.onload=()=>{try{fs.contentWindow.ouvrirSession(U)}catch(e){}};
 fa.srcdoc=a;fs.srcdoc=dec(SRC_S)}
function buildSide(){const w=$('#fa').contentWindow;let h='<div class="ng mod">🌾 ADEL INVEST</div>';
 try{w.eval('NAV').forEach(g=>{h+='<div class="ng">'+g[0]+'</div>';g[1].forEach(k=>{const r=w.eval('ROUTES')[k];h+='<div class="ni" data-k="a:'+k+'"><span class="i">'+r.ic+'</span><span>'+r.n+'</span></div>'})})}catch(e){}
 h+='<div class="ng mod">📊 SIAT — FINANCES</div>';
 SIAT_TABS.forEach(t=>{if(U.role==='editeur'&&(t[0]==='accueil'||t[0]==='rapport'))return;h+='<div class="ni" data-k="s:'+t[0]+'"><span class="i">'+t[1]+'</span><span>'+t[2]+'</span></div>'});
 const s=$('#side');s.innerHTML=h;s.querySelectorAll('.ni').forEach(n=>n.onclick=()=>{const k=n.dataset.k;k[0]==='a'?openA(k.slice(2)):openS(k.slice(2));side(false)})}
function mark(k){CUR=k;document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.k===k))}
function openA(k){$('#fs').classList.remove('show');$('#fa').classList.add('show');try{$('#fa').contentWindow.go(k)}catch(e){}mark('a:'+k)}
function openS(id){$('#fa').classList.remove('show');$('#fs').classList.add('show');try{const w=$('#fs').contentWindow;w.showSection(id,w.document.querySelector('.nav-tab[data-tab="'+id+'"]'))}catch(e){}mark('s:'+id)}
$('#setb').onclick=()=>{try{$('#fa').contentWindow.settings();$('#fs').classList.remove('show');$('#fa').classList.add('show')}catch(e){}};
</script></body></html>
